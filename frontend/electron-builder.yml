appId: com.jarvis.desktop
productName: JARVIS
copyright: Copyright (c) 2026 JARVIS Team

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - public/**/*

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/icon.png
  artifactName: ${productName}-Setup-${version}-win64.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: JARVIS
  runAfterFinish: true
  installerIcon: public/icon.png
  uninstallerIcon: public/icon.png
  installerHeaderIcon: public/icon.png

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: public/icon.png
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  category: public.app-category.productivity
  darkModeSupport: true

dmg:
  title: JARVIS
  icon: public/icon.png
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: public/icon.png
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  category: Utility
  synopsis: JARVIS AI Assistant
  description: Your intelligent desktop companion powered by AI

extraResources:
  - from: resources/
    to: resources/
    filter:
      - "**/*"

publish: null
